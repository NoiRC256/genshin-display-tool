name: Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit to build
        required: false
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and package
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: global.json

      - name: Restore
        run: dotnet restore .\GenshinDisplayTool.sln --runtime win-x64

      - name: Build
        env:
          CI: true
        run: dotnet build .\GenshinDisplayTool.sln --configuration Release --no-restore

      - name: Upload build output
        uses: actions/upload-artifact@v4
        with:
          name: GenshinDisplayTool-build-${{ github.run_number }}
          path: src/GenshinScreenTool/bin/Release
          if-no-files-found: error
          retention-days: 7
