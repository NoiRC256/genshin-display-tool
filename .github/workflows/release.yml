name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Version increment for this release
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package release
    runs-on: windows-latest
    timeout-minutes: 20
    environment: release
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: global.json

      - name: Calculate and create release tag
        id: version
        shell: pwsh
        run: |
          git fetch --tags --force
          $releaseType = '${{ inputs.release_type }}'
          $tags = @(git tag --list 'v[0-9]*' | Where-Object { $_ -match '^v([0-9]+)\.([0-9]+)\.([0-9]+)$' })
          if ($tags.Count -eq 0) {
            $major = 0; $minor = 1; $patch = 0
          } else {
            $latest = $tags | ForEach-Object {
              if ($_ -match '^v([0-9]+)\.([0-9]+)\.([0-9]+)$') {
                [PSCustomObject]@{ Tag = $_; Major = [int]$Matches[1]; Minor = [int]$Matches[2]; Patch = [int]$Matches[3] }
              }
            } | Sort-Object Major, Minor, Patch -Descending | Select-Object -First 1
            $major = $latest.Major; $minor = $latest.Minor; $patch = $latest.Patch
            switch ($releaseType) {
              'patch' { $patch++ }
              'minor' { $minor++; $patch = 0 }
              'major' { $major++; $minor = 0; $patch = 0 }
              default { throw "Unsupported release type '$releaseType'." }
            }
          }
          $version = "$major.$minor.$patch"
          $tag = "v$version"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate $tag --message "Release $tag"
          git push origin $tag
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Package framework-dependent build
        shell: pwsh
        run: .\scripts\package.ps1 -Version '${{ steps.version.outputs.version }}'

      - name: Preserve framework-dependent package
        shell: pwsh
        run: |
          New-Item artifacts/release -ItemType Directory -Force | Out-Null
          Copy-Item artifacts/package/*.zip artifacts/release/

      - name: Package self-contained build
        shell: pwsh
        run: .\scripts\package.ps1 -Version '${{ steps.version.outputs.version }}' -SelfContained

      - name: Collect release assets
        shell: pwsh
        run: |
          New-Item artifacts/release/SHA256SUMS.txt -ItemType File -Force | Out-Null
          Copy-Item artifacts/package/*.zip artifacts/release/
          Get-ChildItem artifacts/release -Filter '*.zip' | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($_.Name)" | Add-Content artifacts/release/SHA256SUMS.txt -Encoding ascii
          }

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: artifacts/release
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: pwsh
        run: |
          $assets = Get-ChildItem artifacts/release -File | ForEach-Object { $_.FullName }
          gh release create $env:TAG @assets --generate-notes --verify-tag
